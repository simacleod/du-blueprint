[package]
name = "du-blueprint"
version = "0.2.1"
edition = "2021"

[lib]
name = "du_blueprint"
path = "src/lib.rs"

[[bin]]
name = "du-blueprint"
path = "src/main.rs"

[dependencies]
lz4 = "1.23.1"
base64 = "0.22.1"
xxhash-rust = { version="0.8.12", features=["xxh64"] }
# Temporary while changes are getting PR'd.
parry3d-f64 = { git = "https://github.com/prharvey/parry.git", branch = "opt" }
rangemap = "1.5.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4.38"
tobj = "4.0.2"
ordered-float = "4.2.2"
clap = { version = "4.5.16", features = ["derive"] }
line_drawing = "1.0.0"
async-std = "1.12.0"
indicatif = "0.17"
parking_lot = { workspace = true }
